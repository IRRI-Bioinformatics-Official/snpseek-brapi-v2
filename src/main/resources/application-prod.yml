server:
  servlet:
    context-path: /brapiv2
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

brapi:
  hdf5:
    # Absolute path to the directory that contains HDF5 genotype files.
    data-dir: ${HDF5_DATA_DIR}

logging:
  level:
    org.irri.snpseek.brapi: INFO
    org.hibernate.SQL: WARN
